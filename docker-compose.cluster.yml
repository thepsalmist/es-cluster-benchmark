# Three-node ES 8.17.1 on one host, for comparing cluster topologies with the
# same harness. All three nodes share this machine's CPU and disk, so absolute
# numbers from it describe this machine, not a real cluster.
#
#   docker compose -f docker-compose.cluster.yml up -d
#   docker compose -f docker-compose.cluster.yml down -v
#
# Runs as a separate compose project from the single-node docker-compose.yml;
# both bind 9200, so bring one down before starting the other.
name: es-cluster-benchmark-cluster

x-es-node: &es-node
  image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
  environment: &es-env
    cluster.name: es-acceptance-cluster
    xpack.security.enabled: "false"
    discovery.seed_hosts: es01,es02,es03
    cluster.initial_master_nodes: es01,es02,es03
    ES_JAVA_OPTS: -Xms1g -Xmx1g

services:
  es01:
    <<: *es-node
    container_name: es-cluster-benchmark-es01
    environment:
      <<: *es-env
      node.name: es01
    ports:
      - "9200:9200"
    volumes:
      - esdata01:/usr/share/elasticsearch/data

  es02:
    <<: *es-node
    container_name: es-cluster-benchmark-es02
    environment:
      <<: *es-env
      node.name: es02
    ports:
      - "9201:9200"
    volumes:
      - esdata02:/usr/share/elasticsearch/data

  es03:
    <<: *es-node
    container_name: es-cluster-benchmark-es03
    environment:
      <<: *es-env
      node.name: es03
    ports:
      - "9202:9200"
    volumes:
      - esdata03:/usr/share/elasticsearch/data

volumes:
  esdata01:
  esdata02:
  esdata03:
